services:
  # One web service. Render injects DATABASE_URL (postgres://...) and the app
  # switches off SQLite automatically (see core/settings.py).
  - type: web
    name: dpt-backend
    runtime: python
    plan: free
    rootDir: backend
    # Free-tier services don't support preDeployCommand, so the schema is
    # applied during the build (all env vars, incl. DATABASE_URL, are
    # available there). migrate is idempotent, so re-running it on every
    # build is safe. On a paid plan this can move back to preDeployCommand
    # so the schema applies strictly before the new version serves traffic.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_admin
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: SECRET_KEY
        generateValue: true          # 50+ random chars, managed by Render
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: NUM_PROXIES
        value: "1"                   # behind Render's proxy — keeps throttling per-user
      - key: DATABASE_URL
        fromDatabase:
          name: dpt-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # set to the frontend origin in the dashboard
      - key: PAYSTACK_SECRET_KEY
        sync: false                  # set in the dashboard; also the webhook HMAC key
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      # Deployed SPA origin — the backend builds the Paystack `callback_url`
      # from it so students land back on /payment/callback after paying.
      # Set to the Vercel URL, e.g. https://your-app.vercel.app (no slash).
      - key: FRONTEND_URL
        sync: false
      # --- First-admin bootstrap (free web services have no shell) ---------
      # The build runs `python manage.py seed_admin`, which creates (or
      # repairs) one admin from these values. Set ADMIN_PASSWORD before the
      # first deploy. The command is idempotent and never rewrites an existing
      # user's password, so it is safe to leave wired into every build.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        sync: false                  # optional; blank leaves the email NULL
      - key: ADMIN_PASSWORD
        sync: false                  # set once; required for the first seed
      # Optional but recommended: on the first deploy this department is created
      # (if missing) and assigned to the admin, so fee creation, student
      # registration and roster imports all work with no manual Docker/admin
      # step. Change the value if your department is named differently.
      - key: ADMIN_DEPARTMENT
        value: Computer Science
      - key: ADMIN_FACULTY
        value: Physical Sciences
      # --- BMONI embedded banking (optional) -------------------------------
      # Leaving BMONI_API_KEY blank keeps the feature switched OFF: the
      # per-department bank-account endpoints answer 503 rather than inventing
      # an account. Nothing else in the app depends on it, so a missing
      # partner key can never block the deploy.
      # Walkthrough: docs/BMONI_SANDBOX_RUNBOOK.md
      - key: BMONI_API_KEY
        sync: false                  # our own partner key, once BMONI issues it
      - key: BMONI_BASE_URL
        value: https://embedded-dev.bmoni.com    # sandbox; production host is embedded.bmoni.com
      # Unset => the webhook receiver fails closed (503) instead of trusting an
      # unsigned delivery. Never commit a real value.
      - key: BMONI_WEBHOOK_SECRET
        sync: false

# The real database. Render's managed PostgreSQL — SQLite would be wiped on
# every deploy, which is exactly what this block prevents.
databases:
  - name: dpt-postgres
    databaseName: dpt
    user: dpt
    # 'free' is deliberate: it is the only Postgres plan that lets this
    # Blueprint apply on a workspace with no billing set up, which is what
    # was blocking the deploy. Trade-off, verified against render.com/docs/free
    # on 2026-09-28:
    #   free        -> 1 GB, single instance per workspace, NO backups, and the
    #                  instance is DELETED 30 days after creation (with a
    #                  14-day window to upgrade first). Fine for the demo and
    #                  the judging period; NOT fine if this must outlive it.
    #   basic-256mb -> smallest paid Postgres: keeps backups and never expires.
    # Switch to it here, or use "Change compute plan" in the dashboard, before
    # the 30 days are up. Backups only exist on a paid plan — see the rollback
    # note in docs/README.md.
    plan: free
